function drawUnit(c,orientation,state,frame,x,y,size,progress){if(state==='empty')return;if(state==='ultimate'){state='attack';frame=Math.min(3,Math.floor(progress*4))}if(!c.orientations[orientation][state])state='idle';const paths=c.orientations[orientation][state];const index=state==='ultimate'&&view!=='duel'?Math.min(paths.length-1,Math.floor(progress*paths.length)):frame%paths.length;const im=imgs.get(paths[index]);if(state==='walk'){const d=orientation==='front'?-1:1;x+=d*progress*52;y-=d*progress*25}ctx.fillStyle='#10233444';ctx.beginPath();ctx.ellipse(x+size*.5,y+size*.9,size*.2,size*.055,0,0,Math.PI*2);ctx.fill();if(im?.complete&&im.naturalWidth)ctx.drawImage(im,x,y,size,size)}
function duelAt(elapsed,c,other){const b=Battle.createBattle(2);b.units=[b.units[0],b.units[3]];b.waveAttempted=true;for(let i=0;i<2;i++){const u=b.units[i];u.id=i?other.id:c.id;u.targetId=i?c.id:other.id;u.spawnAt=0;u.x=i?720:280;u.y=i?260:550;}const until=elapsed%22;while(b.time<until-1e-8)Battle.stepBattle(b,Math.min(1/30,until-b.time));return b;}
function draw(t){if(last!==null&&playing)time+=(t-last)/1000;last=t;const c=cards[selected],other=cards[opponent],elapsed=time-selectedEpoch;const seq=sequence(c),s=auto?seq[Math.floor(elapsed/1.2)%seq.length]:action;const progress=(elapsed%1.2)/1.2;const frame=['idle','walk','attack'].includes(s)?Math.floor(elapsed*6)%4:Math.min(3,Math.floor(progress*4));ctx.clearRect(0,0,1000,670);if(bg.complete&&bg.naturalWidth)ctx.drawImage(bg,0,0,1000,670);ctx.fillStyle='#14263de8';ctx.fillRect(0,0,1000,64);ctx.fillStyle='#ffe9ba';ctx.font='bold 22px system-ui';ctx.fillText(view==='duel'?c.name+'  /  '+other.name:c.name+' · '+(view==='front'?'Face':'Dos'),25,40);ctx.font='17px system-ui';ctx.fillText(labels[s]||'Case libre',795,40);if(view==='duel'){const b=duelAt(elapsed,c,other);for(const u of [...b.units].sort((a,b)=>a.y-b.y)){const card=u.team?other:c;const size=180;drawUnit(card,u.facing||(u.team?'front':'rear'),u.state==='ultimate'?'attack':u.state,u.state==='ultimate'?[0,1,2,3,3,2,1,0][u.frame]:u.frame,u.x-size/2,u.y-size*.92,size,0);ctx.fillStyle='#14263d';ctx.fillRect(u.x-45,u.y+4,90,10);ctx.fillStyle='#87dfb7';ctx.fillRect(u.x-45,u.y+4,u.hp*.9,10);ctx.fillStyle='#fff0c9';ctx.font='14px system-ui';ctx.fillText(u.hp+' PV · '+(labels[u.state]||''),u.x-50,u.y+34);}for(const u of b.units){const effect=Battle.ultimateVisual(u,b.time);if(effect){const im=imgs.get(effect.path);if(im?.complete&&im.naturalWidth){ctx.save();ctx.globalAlpha=effect.opacity;ctx.drawImage(im,effect.x-effect.size/2,effect.y-effect.size*.78,effect.size,effect.size);ctx.restore();}}}ctx.fillStyle='#14263d';ctx.fillRect(0,0,1000,64);ctx.fillStyle='#ffe9ba';ctx.font='bold 21px system-ui';ctx.fillText(c.name+' / '+other.name,24,38);}else drawUnit(c,view,s,frame,340,200,360,progress);$('#caption').textContent=view==='duel'?'Les animaux avancent vers leur cible et attaquent uniquement à portée.':(labels[s]||'Case libre')+(s==='ultimate'?' · Rares, Épiques et Légendaires':s==='dodge'?' · Sphynx devient intangible au troisième coup':'');document.querySelectorAll('[data-action]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.action===s));const required=[c,...(view==='duel'?[other]:[])].flatMap(c=>Object.values(c.orientations).flatMap(o=>Object.values(o).flat()));$('#loading').textContent=required.every(p=>imgs.get(p)?.complete&&imgs.get(p)?.naturalWidth)?'Toutes les images sont chargées.':'Chargement des images…';requestAnimationFrame(draw)}setup();requestAnimationFrame(draw);
</script></html>
